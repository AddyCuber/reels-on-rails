name: Daily Shorts Pipeline

on:
  schedule:
    # Tuned for senior-US audience (65+ = 38%, 55+ = 58%): 6-hour cadence across
    # the full day — morning, midday, evening, late night.
    - cron: '0 10 * * *'  # 10:00 UTC =  6am ET DST /  5am ET standard — early morning
    - cron: '0 16 * * *'  # 16:00 UTC = 12pm ET DST / 11am ET standard — midday
    - cron: '0 22 * * *'  # 22:00 UTC =  6pm ET DST /  5pm ET standard — evening
    - cron: '0 4 * * *'   # 04:00 UTC = 12am ET DST / 11pm ET standard — late night
  workflow_dispatch:        # manual trigger
    inputs:
      skip_jitter:
        description: 'Upload immediately (skip the random 0-90min jitter) — for manual test runs'
        type: boolean
        default: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'                  # cache by hash of requirements.txt
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube token from secret
        run: echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 --decode > youtube_token.json

      - name: Run pipeline
        env:
          # Manual runs can skip the 0-90min upload jitter; scheduled runs keep it.
          UPLOAD_JITTER_MAX_SECONDS: ${{ inputs.skip_jitter == true && '0' || '' }}
        run: python main.py

      - name: Refresh YouTube token secret
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          NEW_TOKEN_B64=$(base64 -w0 youtube_token.json)
          gh secret set YOUTUBE_TOKEN --body "$NEW_TOKEN_B64" --repo "${{ github.repository }}"

      - name: Commit updated stories.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stories.json stories_archive.json used_clips.json upload_log.csv
          git diff --cached --quiet || git commit -m "chore: advance stories index [skip ci]"
          git push
